<div class="">
    <h3>User List</h3>
    <div class="" *ngFor="let item of users">
        <p>{{item.account.username}}</p>
        <p>{{item.profile.fullname}}</p>
        <p>{{item.profile.email}}</p>
        <p>{{item.profile.phone}}</p>
        <p>{{item.role}}</p>
        <p>{{item.active}}</p>

    </div>
</div>
