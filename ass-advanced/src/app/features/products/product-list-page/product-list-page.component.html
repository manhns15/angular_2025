<section class="product-list-page">
    <header class="page-header">
        <div>
            <h1>Danh sach san pham</h1>
            <p>Quan ly va theo doi san pham hien co.</p>
        </div>
        <a routerLink="/products/create">Tao san pham moi</a>
    </header>

    <div class="status" *ngIf="(loading$ | async)">Dang tai du lieu...</div>
    <div class="status error" *ngIf="(error$ | async) as error">
        Loi: {{ error }}
    </div>

    <ng-container *ngIf="(products$ | async) as products">
        <div class="empty-state" *ngIf="!products.length && !(loading$ | async)">
            Chua co san pham nao.
        </div>

        <div class="product-grid" *ngIf="products.length">
            <app-product-card
                *ngFor="let product of products"
                [product]="product"
                (edit)="editProduct($event)"
                (delete)="deleteProduct($event)"
            ></app-product-card>
        </div>
    </ng-container>
</section>
